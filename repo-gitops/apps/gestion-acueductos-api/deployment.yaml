apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-acueductos-api
  namespace: gestion-acueductos-api
  labels:
    app: gestion-acueductos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-acueductos-api
  template:
    metadata:
      labels:
        app: gestion-acueductos-api
    spec:
      containers:
        - name: gestion-acueductos-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
