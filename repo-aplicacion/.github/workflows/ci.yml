name: CI gestion-acueductos-api

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar catálogo y manifiestos YAML
        run: |
          python - <<'EOF'
          import pathlib, yaml
          archivos = ["catalog-info.yaml", *sorted(str(p) for p in pathlib.Path("k8s").glob("*.yaml"))]
          for archivo in archivos:
              list(yaml.safe_load_all(open(archivo, encoding="utf-8")))
              print(f"{archivo} válido")
          EOF
